<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Orbital Ring / GIS Grid Arc -->
  <ellipse cx="20" cy="22" rx="15" ry="6" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 2" stroke-opacity="0.75" transform="rotate(-15 20 22)" />
  <ellipse cx="20" cy="22" rx="15" ry="6" stroke="#2563eb" stroke-width="1.2" stroke-opacity="0.35" transform="rotate(25 20 22)" />

  <!-- Stylized 'V' Telecommunication Lattice Tower -->
  <path d="M10 11L18.5 31C19.2 32.5 20.8 32.5 21.5 31L30 11" stroke="url(#vtel-light-grad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Tower Center Mast -->
  <path d="M20 32V14" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round" />
  <path d="M16 20H24" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" />
  <path d="M17.5 25H22.5" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" />

  <!-- Antenna Summit Transmitter Node -->
  <circle cx="20" cy="12" r="2.8" fill="#06b6d4" stroke="#ffffff" stroke-width="1.4" />

  <!-- High-Frequency Radio Signal Arcs -->
  <path d="M13 8.5C15.2 6.2 24.8 6.2 27 8.5" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
  <path d="M9 5C13 1 27 1 31 5" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="vtel-light-grad" x1="10" y1="11" x2="30" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284c7" />
      <stop offset="0.5" stop-color="#2563eb" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
</svg>
